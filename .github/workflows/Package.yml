name: Build

on:
  workflow_dispatch:

env:
  FLUTTER_VERSION: "3.47.0"

jobs:
  ci-pass:
    name: CI is green
    runs-on: ubuntu-latest
    needs:
      - build
    steps:
      - run: exit 0

  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.host }}
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: windows
            host: windows-latest
            rust_targets: ""
            script: build-windows.sh
          - target: macos
            host: macos-latest
            rust_targets: aarch64-apple-darwin
            script: build-macos-dmg.sh
          - target: linux
            host: ubuntu-latest
            rust_targets: ""
            script: build-linux-appimage.sh
          - target: ios
            host: macos-latest
            rust_targets: aarch64-apple-ios
            script: build-ipa.sh
          - target: android
            host: ubuntu-latest
            rust_targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
            script: build-android.sh
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check core
        if: steps.check_asset.outputs.skip_build != 'true'
        uses: actions/checkout@v3
        with:
          repository: 'niuhuan/pikapika-go-core'
          token: ${{ secrets.CORE_TOKEN }}
          path: 'rust'

      - name: Setup Rust
        if: matrix.rust_targets == ''
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Rust
        if: matrix.rust_targets != ''
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Linux packages
        if: matrix.target == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev libfuse2

      - name: Setup Java
        if: matrix.target == 'android'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Build
        run: bash "scripts/${{ matrix.script }}"

      - name: Sign APK
        if: matrix.target == 'android'
        env:
          KEY_FILE_BASE64: ${{ secrets.KEY_FILE_BASE64 }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: bash scripts/sign-apk-github-actions.sh

      - name: Stage artifacts
        env:
          TARGET: ${{ matrix.target }}
          STAGE_ONLY: "1"
        run: bash ci/upload_asset.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}-${{ github.run_number }}
          path: build/release-assets/
          retention-days: 3
