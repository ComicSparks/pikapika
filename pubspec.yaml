name: pikapika
description: A cross platform comic client.
publish_to: 'none'

version: 1.8.23+47

environment:
  sdk: ^3.10.3

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  rust_lib_pikapika:
    path: rust_builder
  flutter_rust_bridge: 2.12.0
  event: ^2.1.2
  flutter_svg: ^2.2.0
  flutter_styled_toast: ^2.2.1
  another_xlider: ^3.0.2
  scrollable_positioned_list: ^0.3.8
  permission_handler: ^11.4.0
  url_launcher: ^6.3.1
  photo_view: ^0.15.0
  modal_bottom_sheet: ^3.0.0
  image_cropper: ^9.1.0
  image_picker: ^1.2.0
  file_picker: ^8.3.7
  filesystem_picker: ^4.1.0
  crop_image: ^1.0.16
  image: ^4.5.4
  path: ^1.9.1
  easy_localization: ^3.0.7+1
  zoomable_positioned_list: ^1.1.0
  app_links: ^6.4.1
  window_manager: ^0.4.3
  local_auth: ^2.3.0
  gal: ^2.3.2
  connectivity_plus: ^6.1.4
  freezed_annotation: ^2.4.4
  flutter_inappwebview: ^6.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - lib/assets/
    - lib/assets/translations/
